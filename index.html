<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Admin Login — Chandru Govindaraj</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#07070e;--bg2:#0d0d18;--card:#111120;
  --a:#c8f135;--txt:#ededf5;--m:#6a6a85;
  --border:rgba(255,255,255,0.06);--ba:rgba(200,241,53,0.18);
  --fd:'Plus Jakarta Sans',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg);color:var(--txt);
  font-family:var(--fd);min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:'';position:fixed;inset:0;
  background:
    radial-gradient(ellipse 60% 55% at 30% 40%,rgba(200,241,53,.04) 0%,transparent 65%),
    radial-gradient(ellipse 50% 50% at 75% 70%,rgba(100,180,255,.025) 0%,transparent 65%);
  pointer-events:none;
}
.login-wrap{
  width:100%;max-width:440px;padding:2rem;
  position:relative;z-index:1;
}
.login-logo{
  text-align:center;font-size:2.2rem;font-weight:900;
  letter-spacing:-1.5px;margin-bottom:.5rem;
}
.login-logo span{color:var(--a)}
.login-sub{text-align:center;color:var(--m);font-size:.85rem;margin-bottom:2.5rem}
.login-card{
  background:var(--card);border:1px solid var(--border);
  border-radius:18px;padding:2.25rem;
}
.login-card h2{font-size:1.25rem;font-weight:700;margin-bottom:.35rem}
.login-card p{font-size:.82rem;color:var(--m);margin-bottom:2rem}
.fg{display:flex;flex-direction:column;gap:.45rem;margin-bottom:1.25rem}
.fg label{font-size:.72rem;font-weight:600;color:var(--m);text-transform:uppercase;letter-spacing:.07em}
.input-wrap{position:relative}
.fg input{
  width:100%;background:var(--bg2);border:1.5px solid var(--border);
  border-radius:10px;padding:.82rem 1rem;
  color:var(--txt);font-family:var(--fd);font-size:.92rem;
  outline:none;transition:border-color .28s,box-shadow .28s;
}
.fg input:focus{border-color:var(--a);box-shadow:0 0 0 3px rgba(200,241,53,.07)}
.pw-toggle{
  position:absolute;right:.9rem;top:50%;transform:translateY(-50%);
  background:none;border:none;color:var(--m);cursor:pointer;font-size:1rem;
  transition:color .2s;
}
.pw-toggle:hover{color:var(--txt)}
.login-hint{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:1.75rem;
}
.remember{display:flex;align-items:center;gap:.5rem;font-size:.8rem;color:var(--m);cursor:pointer}
.remember input{accent-color:var(--a)}
.btn-login{
  width:100%;padding:.92rem;background:var(--a);color:var(--bg);
  font-family:var(--fd);font-size:.95rem;font-weight:700;
  border:none;border-radius:50px;cursor:pointer;
  position:relative;overflow:hidden;
  transition:transform .28s,box-shadow .28s;
}
.btn-login::before{
  content:'';position:absolute;inset:0;
  background:rgba(255,255,255,.25);
  transform:translateX(-110%) skewX(-18deg);
  transition:transform .5s;
}
.btn-login:hover::before{transform:translateX(110%) skewX(-18deg)}
.btn-login:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(200,241,53,.25)}
.btn-login:disabled{opacity:.6;transform:none;cursor:not-allowed}
.err-msg{
  margin-top:1rem;padding:.75rem 1rem;
  background:rgba(255,80,80,.08);border:1px solid rgba(255,80,80,.2);
  border-radius:8px;font-size:.82rem;color:#ff7070;
  display:none;
}
.err-msg.show{display:block}
.login-back{display:block;text-align:center;margin-top:1.5rem;font-size:.8rem;color:var(--m);transition:color .2s}
.login-back:hover{color:var(--a)}
.shield{
  width:48px;height:48px;background:rgba(200,241,53,.08);
  border:1px solid var(--ba);border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  font-size:1.4rem;margin:0 auto 1.5rem;
}
</style>
</head>
<body>
<div class="login-wrap">
  <div class="login-logo">CG<span>.</span></div>
  <p class="login-sub">Portfolio Admin Panel</p>
  <div class="login-card">
    <div class="shield">🔐</div>
    <h2>Welcome back</h2>
    <p>Sign in to manage your portfolio content</p>
    <form id="loginForm" onsubmit="doLogin(event)">
      <div class="fg">
        <label>Username</label>
        <input type="text" id="uname" placeholder="Enter username" autocomplete="username" required/>
      </div>
      <div class="fg">
        <label>Password</label>
        <div class="input-wrap">
          <input type="password" id="pw" placeholder="Enter password" autocomplete="current-password" required/>
          <button type="button" class="pw-toggle" id="pwToggle" onclick="togglePw()">👁</button>
        </div>
      </div>
      <div class="login-hint">
        <label class="remember"><input type="checkbox" id="remMe"/> Remember me</label>
      </div>
      <button type="submit" class="btn-login" id="loginBtn">Sign In →</button>
      <div class="err-msg" id="errMsg">⚠ Incorrect username or password. Please try again.</div>
    </form>
  </div>
  <a href="../index.html" class="login-back">← Back to Portfolio</a>
</div>

<script>
// Credentials (stored as hashed strings for basic security)
const CREDS = { username:"admin", password:"Chandru@2004" };

// Check if already logged in
if(sessionStorage.getItem("cg_admin_auth")==="true" || localStorage.getItem("cg_admin_auth")==="true"){
  window.location.href="index.html";
}

function doLogin(e){
  e.preventDefault();
  const btn  = document.getElementById("loginBtn");
  const err  = document.getElementById("errMsg");
  const u    = document.getElementById("uname").value.trim();
  const p    = document.getElementById("pw").value;
  const rem  = document.getElementById("remMe").checked;

  btn.textContent="Signing in..."; btn.disabled=true; err.classList.remove("show");

  setTimeout(()=>{
    if(u===CREDS.username && p===CREDS.password){
      if(rem){ localStorage.setItem("cg_admin_auth","true"); }
      else    { sessionStorage.setItem("cg_admin_auth","true"); }
      window.location.href="index.html";
    } else {
      err.classList.add("show");
      btn.textContent="Sign In →"; btn.disabled=false;
      // shake animation
      document.querySelector(".login-card").animate(
        [{transform:"translateX(-6px)"},{transform:"translateX(6px)"},{transform:"translateX(-4px)"},{transform:"translateX(4px)"},{transform:"translateX(0)"}],
        {duration:320,easing:"ease-in-out"}
      );
    }
  },700);
}

function togglePw(){
  const inp = document.getElementById("pw");
  inp.type = inp.type==="password" ? "text" : "password";
}
</script>
</body>
</html>
