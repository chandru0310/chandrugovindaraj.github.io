<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio Admin — Chandru Govindaraj</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body class="admin-body">

<div class="admin-layout">

  <!-- ─── SIDEBAR ─── -->
  <aside class="admin-sidebar" id="adminSidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">CG<span class="dot">.</span> Admin</div>
      <button class="sidebar-close" id="sidebarClose">✕</button>
    </div>
    <nav class="sidebar-nav">
      <button class="sidebar-item active" data-tab="profile">👤 Profile</button>
      <button class="sidebar-item" data-tab="skills">⚡ Skills</button>
      <button class="sidebar-item" data-tab="projects">🚀 Projects</button>
      <button class="sidebar-item" data-tab="certifications">📜 Certifications</button>
    </nav>
    <div class="sidebar-footer">
      <a href="../index.html" class="sidebar-link">← View Site</a>
      <button class="sidebar-link danger" id="resetBtn">↺ Reset All</button>
    </div>
  </aside>

  <!-- ─── MAIN ─── -->
  <main class="admin-main">

    <!-- TOP BAR -->
    <div class="admin-topbar">
      <button class="topbar-menu" id="menuToggle">☰</button>
      <div class="topbar-title" id="topbarTitle">Profile</div>
      <div class="topbar-actions">
        <span class="save-status" id="saveStatus"></span>
        <button class="btn-primary" id="saveBtn" onclick="saveAll()">Save Changes</button>
      </div>
    </div>

    <!-- ─── PROFILE TAB ─── -->
    <section class="admin-tab active" id="tab-profile">
      <div class="admin-section-title">Profile Information</div>
      <div class="admin-card">
        <div class="form-grid">
          <div class="form-group"><label>Full Name</label><input type="text" id="profileName" /></div>
          <div class="form-group"><label>Title / Tagline (short)</label><input type="text" id="profileTitle" /></div>
          <div class="form-group full"><label>Bio / Tagline (long)</label><textarea id="profileTagline" rows="3"></textarea></div>
          <div class="form-group"><label>Email</label><input type="email" id="profileEmail" /></div>
          <div class="form-group"><label>Phone</label><input type="text" id="profilePhone" /></div>
          <div class="form-group"><label>LinkedIn Username</label><input type="text" id="profileLinkedin" /></div>
          <div class="form-group"><label>Blog URL</label><input type="url" id="profileBlog" /></div>
          <div class="form-group"><label>Location</label><input type="text" id="profileLocation" /></div>
          <div class="form-group full"><label>Full Address</label><textarea id="profileAddress" rows="2"></textarea></div>
        </div>
      </div>
    </section>

    <!-- ─── SKILLS TAB ─── -->
    <section class="admin-tab" id="tab-skills">
      <div class="admin-section-header">
        <div class="admin-section-title">Skills</div>
        <button class="btn-add" onclick="addSkill()">+ Add Skill</button>
      </div>
      <div id="skillsList" class="items-list"></div>
    </section>

    <!-- ─── PROJECTS TAB ─── -->
    <section class="admin-tab" id="tab-projects">
      <div class="admin-section-header">
        <div class="admin-section-title">Projects</div>
        <button class="btn-add" onclick="addProject()">+ Add Project</button>
      </div>
      <div id="projectsList" class="items-list"></div>
    </section>

    <!-- ─── CERTIFICATIONS TAB ─── -->
    <section class="admin-tab" id="tab-certifications">
      <div class="admin-section-header">
        <div class="admin-section-title">Certifications &amp; Events</div>
        <button class="btn-add" onclick="addCert()">+ Add Cert</button>
      </div>
      <div id="certsList" class="items-list"></div>
    </section>

  </main>
</div>

<div class="toast" id="toast"></div>

<script src="../js/data.js"></script>
<script src="admin.js"></script>
</body>
</html>
